name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      # Testcontainers needs Docker; GitHub-hosted runners ship with it.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: apps/api/target/surefire-reports
          retention-days: 7
