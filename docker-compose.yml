# Local development infrastructure only. App runs from IDE / mvnw.
# Production compose lives in infra/.
services:
  postgres:
    image: postgres:17-alpine
    container_name: flagpole-postgres
    environment:
      POSTGRES_DB: flagpole
      POSTGRES_USER: flagpole
      POSTGRES_PASSWORD: flagpole
    ports:
      # host 5434 -> container 5432 (5432/5433 on the host are often taken by other Postgres instances)
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagpole -d flagpole"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flagpole-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: flagpole-keycloak
    # dev mode: embedded H2 (ephemeral, lives in the container), no TLS, realm re-imported on every start.
    # Users/clients you add via the admin console are lost on `docker compose down`; edit the realm JSON instead.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # image has no curl; talk to the management port (9000) with bash's /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
