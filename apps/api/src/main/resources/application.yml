spring:
  application:
    name: flagpole-api
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/flagpole}
    username: ${DB_USER:flagpole}
    password: ${DB_PASSWORD:flagpole}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm. Token "iss" claim must match exactly. Decoder is lazy: API boots without Keycloak up.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/flagpole}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    dev.flagpole: DEBUG
